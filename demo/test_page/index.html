<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>RPA 元素测试页</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 24px; }
  table { border-collapse: collapse; margin: 12px 0; }
  td, th { border: 1px solid #999; padding: 6px 12px; }
  #hover { width: 160px; padding: 10px; background: #eef; border: 1px dashed #66c; }
  #bottom { margin-top: 12px; padding: 12px; background: #efe; }
</style>
</head>
<body>
  <h1 id="title">RPA 元素测试页</h1>

  <p>
    <input id="name" placeholder="姓名" value="">
    <button id="btn" onclick="document.getElementById('status').innerText='已点击';document.getElementById('agree').checked=true;">提交</button>
  </p>

  <p>
    <label><input type="checkbox" id="agree"> 我同意</label>
    <select id="city">
      <option value="bj">北京</option>
      <option value="sh">上海</option>
      <option value="gz">广州</option>
      <option value="sz">深圳</option>
    </select>
  </p>

  <p id="status">初始状态</p>

  <!-- 文件上传：给 upload_web_file 用 -->
  <p>
    <input type="file" id="fileInput" onchange="document.getElementById('upload-status').innerText='已选择：'+ (this.files[0] ? this.files[0].name : '');">
    <span id="upload-status">尚未选择文件</span>
  </p>

  <!-- 文件下载：给 download_web_file 用 -->
  <p>
    <a id="dl" href="download_sample.csv" download="sample.csv">下载样例 CSV</a>
  </p>

  <table id="tbl">
    <thead>
      <tr><th>编号</th><th>名称</th><th>数量</th></tr>
    </thead>
    <tbody>
      <tr><td>R01</td><td>沙发</td><td>1</td></tr>
      <tr><td>R02</td><td>茶几</td><td>2</td></tr>
      <tr><td>R03</td><td>电视柜</td><td>3</td></tr>
    </tbody>
  </table>

  <ul id="list">
    <li class="item">列表项一</li>
    <li class="item">列表项二</li>
    <li class="item">列表项三</li>
  </ul>

  <div id="hover" onmouseover="document.getElementById('status').innerText='已悬停';">把鼠标移上来</div>

  <p>
    <input type="range" id="slider" min="0" max="100" value="10" style="width:220px;">
  </p>

  <!-- 自定义滑块：给 slider_hover 用（需要能单独拾取的 thumb + 轨道） -->
  <p>
    <span id="track" style="display:inline-block;width:300px;height:24px;background:#ddd;position:relative;vertical-align:middle;">
      <span id="thumb" style="display:block;width:24px;height:24px;background:#333;position:absolute;left:0;top:0;cursor:pointer;"></span>
    </span>
    <span>滑块值：<span id="slider-val">0</span></span>
  </p>
  <script>
    (function () {
      var dragging = false;
      var track = document.getElementById('track');
      var thumb = document.getElementById('thumb');
      var out = document.getElementById('slider-val');
      thumb.addEventListener('mousedown', function () { dragging = true; });
      document.addEventListener('mouseup', function () { dragging = false; });
      document.addEventListener('mousemove', function (e) {
        if (!dragging) return;
        var r = track.getBoundingClientRect();
        var max = r.width - thumb.offsetWidth;
        var x = Math.max(0, Math.min(e.clientX - r.left - thumb.offsetWidth / 2, max));
        thumb.style.left = x + 'px';
        out.innerText = String(Math.round((x / max) * 100));
      });
    })();
  </script>

  <div style="height: 1200px; background: linear-gradient(#fff,#ddd);">（滚动占位区，往下滚才能看到底部）</div>

  <div id="bottom">页面底部标记 BOTTOM-MARK</div>
</body>
</html>
